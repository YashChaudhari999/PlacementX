name: PlacementX CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scan tracked files and Git history for secrets
      run: node scripts/security-audit.mjs --history

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint --workspace=apps/web
    - run: npm run type-check --workspace=apps/web
    - run: npm run build --workspace=apps/web
    
  api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint --workspace=apps/api
    - run: npm run type-check --workspace=apps/api
    - run: npm run build --workspace=apps/api
    - run: npm test --workspace=apps/api


